<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#d9c2ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#d9c2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f0ff"/>
      <stop offset=".5" stop-color="#9c8fc4"/>
      <stop offset="1" stop-color="#3e3466"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d4fc2"/>
      <stop offset="1" stop-color="#2a1d5c"/>
    </linearGradient>
    <radialGradient id="gem" cx="40%" cy="35%" r="60%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#d1902a"/>
    </radialGradient>
  </defs>
  <circle cx="150" cy="200" r="150" fill="url(#glow)"/>
  <ellipse cx="150" cy="360" rx="105" ry="12" fill="#000" opacity=".35"/>
  <!-- 大盾 -->
  <path d="M150 40 L250 75 L250 200 C250 280 190 330 150 355 C110 330 50 280 50 200 L50 75 Z" fill="url(#metal)"/>
  <path d="M150 62 L230 90 L230 200 C230 268 182 310 150 332 C118 310 70 268 70 200 L70 90 Z" fill="url(#face)"/>
  <path d="M150 62 L150 332 M70 160 L230 160" stroke="#e8c98f" stroke-width="6"/>
  <path d="M150 62 L230 90 L230 200 C230 268 182 310 150 332 C118 310 70 268 70 200 L70 90 Z" fill="none" stroke="#e8c98f" stroke-width="4"/>
  <!-- 中央の紋章 -->
  <circle cx="150" cy="160" r="34" fill="#2a1d5c" stroke="#e8c98f" stroke-width="5"/>
  <circle cx="150" cy="160" r="20" fill="url(#gem)"/>
  <!-- 鋲 -->
  <g fill="#e8c98f">
    <circle cx="70" cy="90" r="6"/><circle cx="230" cy="90" r="6"/>
    <circle cx="80" cy="240" r="6"/><circle cx="220" cy="240" r="6"/><circle cx="150" cy="315" r="6"/>
  </g>
  <!-- 光 -->
  <path d="M95 90 L125 75" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".6"/>
</svg>
