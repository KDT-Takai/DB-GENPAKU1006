<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#e3b8ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#e3b8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".6" stop-color="#ffd6ff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="bow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a8"/>
      <stop offset=".5" stop-color="#c9933a"/>
      <stop offset="1" stop-color="#ffe7a8"/>
    </linearGradient>
    <radialGradient id="meteor" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#ffb8f5"/>
      <stop offset="1" stop-color="#a26bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="150" cy="190" r="150" fill="url(#glow)"/>
