  <path d="M90 60 L150 200 L90 340" stroke="#f3eaff" stroke-width="2.5" fill="none"/>
  <circle cx="90" cy="60" r="8" fill="#e8c98f"/><circle cx="90" cy="340" r="8" fill="#e8c98f"/>
